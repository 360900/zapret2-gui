# nfpm config for every native package. Build with packaging/build.sh.
name: zapret2-gui
arch: all
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: 360900 <ziyad.koca@hotmail.com>
description: |
  One-click DPI bypass for blocked websites.
  Installs and configures zapret2, finds a working bypass method with
  blockcheck2 and keeps it running.
vendor: 360900
homepage: https://github.com/360900/zapret2-gui
license: GPL-3.0-or-later

contents:
  - src: src/zapret2-gui
    dst: /opt/zapret2-gui/zapret2-gui
    file_info: {mode: 0755}
  - src: src/zapret2-gui-helper
    dst: /opt/zapret2-gui/zapret2-gui-helper
    file_info: {mode: 0755}
  - src: /opt/zapret2-gui/zapret2-gui
    dst: /usr/bin/zapret2-gui
    type: symlink
  - src: data/zapret2-gui.desktop
    dst: /usr/share/applications/zapret2-gui.desktop
    file_info: {mode: 0644}
  - src: data/zapret2-gui.svg
    dst: /usr/share/icons/hicolor/scalable/apps/zapret2-gui.svg
    file_info: {mode: 0644}
  - src: data/org.zapret2gui.policy
    dst: /usr/share/polkit-1/actions/org.zapret2gui.policy
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/licenses/zapret2-gui/LICENSE
    file_info: {mode: 0644}
  - src: README.md
    dst: /usr/share/doc/zapret2-gui/README.md
    file_info: {mode: 0644}

scripts:
  preremove: packaging/scripts/preremove.sh

overrides:
  deb:
    depends:
      - python3
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1 (>= 1.2)
      - curl
      - nftables
      - pkexec | policykit-1
      - procps
      - bind9-dnsutils | dnsutils
  rpm:
    # Capabilities and file paths resolve on both Fedora/RHEL and openSUSE.
    depends:
      - python3
      - python3-gobject
      - typelib(Gtk) = 4.0
      - typelib(Adw) = 1
      - curl
      - nftables
      - /usr/bin/pkexec
      - /usr/bin/pgrep
      - /usr/bin/nslookup
  archlinux:
    depends:
      - python
      - python-gobject
      - gtk4
      - libadwaita
      - curl
      - nftables
      - polkit
      - procps-ng
      - bind
  apk:
    depends:
      - python3
      - py3-gobject3
      - gtk4.0
      - libadwaita
      - curl
      - nftables
      - polkit
      - procps
      - bind-tools
